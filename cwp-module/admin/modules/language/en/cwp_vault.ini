F_IMMUTABLE="Immutable mode (ransomware protection)"
H_IMMUTABLE="Stops anyone with access to this server, or a stolen key, from erasing your backups. It needs a NEW bucket created at your storage provider with Object Lock enabled and a default retention: an existing bucket cannot be switched over. Turn this on only after that bucket is set in Storage above. Deleted data is kept until the lock ends, plus 7 days, so storage use grows by roughly that much deleted data. Setup steps are in the install guide."
F_LOCKMODE="Lock mode"
H_LOCKMODE="COMPLIANCE: nobody can remove locked data before the time is up, not even the storage account owner. This is the real protection. GOVERNANCE: a key with the bypass permission can still delete, so use it for testing only. Must match the bucket default retention."
